run: docker compose up --build -d
seed: node database/run-migrations.js && node database/seed.js
test: node_modules/.bin/vitest run tests/cost.service.test.js tests/retry.test.js
base_url: http://localhost:8080
endpoints:
  - GET /api/health
  - POST /api/usage
  - GET /api/usage
  - POST /api/billing/checkout
  - POST /api/webhooks/stripe
  - POST /api/ai/generate
  - GET /api/ai/jobs/:jobId