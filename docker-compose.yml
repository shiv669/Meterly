services:
  postgres:
    image: postgres:16-alpine
    container_name: meterly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meterly}
      POSTGRES_USER: ${POSTGRES_USER:-meterly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meterly_dev_password}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - meterly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meterly} -d ${POSTGRES_DB:-meterly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meterly-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-meterly}
      DB_USER: ${POSTGRES_USER:-meterly}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-meterly_dev_password}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:8080/billing/success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:8080/billing/cancel}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meterly-worker
    restart: unless-stopped
    command: ["node", "worker/index.js"]
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-meterly}
      DB_USER: ${POSTGRES_USER:-meterly}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-meterly_dev_password}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      WORKER_RETRY_BASE_DELAY_MS: ${WORKER_RETRY_BASE_DELAY_MS:-1000}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-86400000}
    depends_on:
      postgres:
        condition: service_healthy

  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meterly-ai-worker
    restart: unless-stopped
    command: ["node", "worker/ai.worker.js"]
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-meterly}
      DB_USER: ${POSTGRES_USER:-meterly}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-meterly_dev_password}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      AI_WORKER_MAX_ATTEMPTS: ${AI_WORKER_MAX_ATTEMPTS:-3}
      AI_WORKER_POLL_INTERVAL_MS: ${AI_WORKER_POLL_INTERVAL_MS:-1000}
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    container_name: meterly-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dashboard:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  meterly-postgres-data:
