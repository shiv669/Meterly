services:
  postgres:
    image: postgres:16-alpine
    container_name: meterly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meterly}
      POSTGRES_USER: ${POSTGRES_USER:-meterly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meterly_dev_password}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - meterly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meterly} -d ${POSTGRES_DB:-meterly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:stable-alpine
    container_name: meterly-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  meterly-postgres-data:
